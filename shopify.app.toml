# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration
# `npm run config:link` rewrites this file and has dropped webhook subscriptions
# and bumped api_version before now — diff it before committing.

client_id = "cf910c1665cd705b068ebac7863b1966"
name = "Amend"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[webhooks]
# Keep in step with `ApiVersion.July26` in app/shopify.server.ts, .graphqlrc.ts,
# and API_VERSION in scripts/.
api_version = "2026-07"

  # Handled by: /app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  # Completion signal for every job that runs through Bulk Operations.
  # Handled by: /app/routes/webhooks.bulk_operations.finish.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/bulk_operations/finish"
  topics = ["bulk_operations/finish"]

  # Handled by: /app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = ["app/scopes_update"]

  # Keeps Shop.plan honest without waiting for a page load — a card declining
  # or a trial ending is exactly the case nobody opens the app to cause.
  # Handled by: /app/routes/webhooks.app.subscriptions_update.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/subscriptions_update"
  topics = ["app_subscriptions/update"]

  # Mandatory GDPR compliance webhooks (public apps).
  # See: https://shopify.dev/docs/apps/build/privacy-law-compliance
  # Handled by: /app/routes/webhooks.customers.data_request.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = ["customers/data_request"]

  # Handled by: /app/routes/webhooks.customers.redact.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = ["customers/redact"]

  # Handled by: /app/routes/webhooks.shop.redact.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = ["shop/redact"]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_products"

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]
